<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CareerTrackr</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<h1>CareerTrackr</h1>

<a href="/applications/new">Add New Application</a>

<table>
    <thead>
        <tr>
            <th>Company</th>
            <th>Role</th>
            <th>Status</th>
            <th>Applied</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.companyName}"></td>
            <td th:text="${app.roleTitle}"></td>
            <td th:text="${app.status}"></td>
            <td th:text="${app.appliedDate}"></td>

            <td>
                <a th:href="@{/applications/edit/{id}(id=${app.id})}">
                    Edit
                </a>

                <a th:href="@{/applications/delete/{id}(id=${app.id})}">
                    Delete
                </a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
